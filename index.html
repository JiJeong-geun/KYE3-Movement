<!-- 여기에 movement.kye3.com과 같은 GTM 스니펫을 넣으면 아래 dataLayer 이벤트가 그대로 수집돼요. -->
<style>
:root{--bg:#0a0a0a;--panel:#141414;--line:#262626;--fg:#f5f5f5;--mute:#8a8a8a;--acc:#d4ff3a;--red:#ff4d3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
#app{max-width:480px;margin:0 auto;padding:max(24px,calc(env(safe-area-inset-top) + 12px)) max(30px,env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(30px,env(safe-area-inset-left))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:42px;min-height:42px;padding:0 8px;border-radius:14px;background:var(--acc);color:#0a0a0a;font-weight:700;font-size:14px;line-height:1.2;text-align:center;text-decoration:none}
.btn.white{background:#fff}
.btn:disabled{opacity:.3;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid #3a3a3a}
.btn:active{transform:scale(.985)}
#dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:24px}
.dlgbox{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px}
.dlgbox p{margin:0 0 18px;font-size:16px;line-height:1.5;text-align:center;white-space:pre-line}
.dlgbox .btnrow{margin-top:0}
.link{display:block;margin:14px auto 0;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.btnrow{display:flex;gap:10px;margin-top:14px}.btnrow .btn{flex:1}
.fine{color:#6f6f6f;font-size:12px;line-height:1.6;margin:18px 2px 0}
.eyebrow{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.14em}
.ico{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px}
.brand{font-weight:900;font-size:20px;letter-spacing:.02em}
.brand{display:flex;align-items:flex-end}
.brand .logo{height:22px;width:auto;display:block}
.logolink{display:block;line-height:0}
.brand span{color:var(--acc);font-size:13px;font-weight:700;letter-spacing:.16em;margin-left:16px;margin-bottom:3px;line-height:1}
.hero h1{font-size:36px;line-height:1.18;margin:10px 0 12px;font-weight:900;letter-spacing:-.02em}
.hero p{color:#bdbdbd;font-size:15px;line-height:1.65;margin:0 0 20px}
.hero b{color:var(--acc)}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.progress .bar{flex:1;height:6px;border-radius:3px;background:#222;overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.progress span{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.demo-badge{display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:999px;border:1px solid #3a3a3a;color:var(--mute);font-size:12px}
#evList{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.evcard{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left}
.evcard.done{border-color:#3b4a12}
.evico{width:44px;height:44px;flex:none;padding:10px;border-radius:12px;background:#1d1d1d;color:var(--acc)}
.evtxt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.evtxt b{font-size:16px}
.evtxt small{color:var(--mute);font-size:12.5px}
.evstat{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.evstat em{font-style:normal;font-weight:900;font-size:24px;color:var(--acc);font-variant-numeric:tabular-nums}
.evstat small{color:var(--mute);font-size:11.5px}
footer{margin-top:26px;text-align:center;color:#555;font-size:12px}

/* event */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:6px 0 10px}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;padding:0;font-size:26px;line-height:1}
.tt{text-align:center;font-weight:800;font-size:16px}
.step{text-align:right;color:var(--mute);font-size:12.5px}
.stagebox{min-height:calc(100dvh - 200px);display:flex;flex-direction:column;justify-content:center;padding-bottom:10px}
.intro{display:flex;flex-direction:column;gap:12px}
.bigico{width:56px;height:56px;padding:13px;margin-bottom:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--acc)}
.intro h2{font-size:32px;margin:0;font-weight:900;letter-spacing:-.01em}
.lead{margin:0;color:#bdbdbd;font-size:15px}
.how{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.how li{counter-increment:s;position:relative;padding:12px 14px 12px 46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.55;color:#e4e4e4}
.how li::before{content:counter(s);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#0a0a0a;font-weight:900;font-size:12.5px;display:grid;place-items:center}
.warn{margin:2px 2px 6px;color:#c9a227;font-size:13px;line-height:1.55}
.cd{text-align:center}
.cdl{color:#bdbdbd;font-size:16px;line-height:1.55;margin-bottom:8px}
.cdl b{color:var(--acc)}
.cdn{font-size:140px;font-weight:900;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.cdn.go{font-size:92px;letter-spacing:-.02em}
.measure{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.status{font-size:44px;font-weight:900;color:var(--acc);letter-spacing:-.01em}
.status.dim{color:#3d3d3d;font-size:34px;line-height:1.35}
.timer{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.big{font-size:120px;line-height:1}
.dots{display:flex;gap:10px}.dots i{width:14px;height:14px;border-radius:50%;background:#2a2a2a}.dots i.on{background:var(--acc)}
.jlist{display:flex;flex-direction:column;gap:6px;min-height:84px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.measure .btn{margin-top:10px}
.react{position:relative;overflow:hidden;touch-action:manipulation;border-radius:24px;min-height:62dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#171717;border:1px solid var(--line);text-align:center;padding:20px}
.react.go{background:var(--acc);color:#0a0a0a;border-color:var(--acc)}
.react.bad{background:var(--red);color:#fff;border-color:var(--red)}
.rxr{font-size:13px;letter-spacing:.14em;opacity:.75;font-weight:700}
.rxm{font-size:64px;font-weight:900;letter-spacing:-.01em}
.rxs{font-size:14px;opacity:.75;line-height:1.5;min-height:21px}
.tgt{position:absolute;width:104px;height:104px;border-radius:50%;background:var(--acc);color:#0a0a0a;font-weight:900;font-size:20px;letter-spacing:.04em;box-shadow:0 0 0 10px rgba(212,255,58,.18),0 0 40px rgba(212,255,58,.55);touch-action:manipulation}
.rankbox{margin-top:6px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.rk{display:flex;align-items:center;gap:14px}
.grade{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:900;background:var(--acc);color:#0a0a0a;flex:none}
.grade.gC{background:#8a8a8a}.grade.gD{background:#3a3a3a;color:#fff}
.rk strong{display:block;font-size:17px}.rk small{color:var(--mute);font-size:12.5px}
.rklist{margin-top:14px}.rklist .t{color:var(--mute);font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.rklist ol{list-style:none;margin:0;padding:0}
.rklist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 6px;border-top:1px solid var(--line);font-size:14.5px;font-variant-numeric:tabular-nums}
.rklist li.me{color:var(--acc);font-weight:800}
.rklist li small{color:var(--mute);font-size:12px}
.wob{display:grid;grid-template-columns:repeat(var(--n,30),1fr);align-items:end;gap:3px;height:90px;width:100%;margin-top:6px}
.wob i{display:block;min-height:4px;border-radius:2px;background:var(--acc)}
.wob i.hi{background:var(--red)}
.meter{width:100%;height:26px;border-radius:13px;background:#222;overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d4ff3a,#ffb020,#ff4d3d)}
.meter u{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:0}
.bignum{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.bignum small{font-size:22px;color:var(--mute);margin-left:6px}

.result{display:flex;flex-direction:column;gap:12px}
.rmain{font-size:96px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rmain small{font-size:26px;color:var(--mute);margin-left:8px;letter-spacing:0}
.rscore{color:var(--mute);font-size:14px;letter-spacing:.06em}.rscore b{color:var(--acc);font-size:22px}
.rpct{margin:12px 0 0;color:#e4e4e4;font-size:16px}.rpct:empty{display:none}.rpct b{color:var(--acc);font-size:22px}.rpct small{color:var(--mute);margin-left:8px;font-size:12px}
.sexpick{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 6px}.sexpick .sl{font-size:14px;line-height:1;padding-top:7px;color:#cfcfcf}.sexpick em{font-style:normal;color:var(--mute);font-size:12px}
.seg{display:flex;gap:6px}.seg button{padding:8px 12px;border-radius:999px;border:1px solid #333;color:#bdbdbd;font-size:13px}.seg button.on{background:var(--acc);border-color:var(--acc);color:#0a0a0a;font-weight:800}
.sexnote{margin:6px 2px 0}
.how li.sx{margin-bottom:12px}
.sexbox{margin-top:0}
.how li.sx{counter-increment:none;padding:0;background:none;border:0}.how li.sx::before{display:none}
.rbar{height:8px;border-radius:4px;background:#222;overflow:hidden}.rbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .7s}
.rcomment{margin:0;font-size:16px;line-height:1.6;color:#e4e4e4}
.rsub{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rsub div{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.rsub span{color:var(--mute)}.rsub b{font-variant-numeric:tabular-nums}
.errbox{padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);line-height:1.65;font-size:14.5px;color:#d6d6d6}
.errbox h3{margin:0 0 8px;font-size:19px;color:var(--fg)}

/* final */
#card{width:100%;height:auto;border-radius:4.8% / 3.85%;display:block;background:#0a0a0a}
.nick{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--mute);font-size:13.5px}
.colorrow{display:flex;align-items:center;gap:10px;margin:12px 0 0;color:var(--mute);font-size:13.5px}
.nick .lbl,.colorrow .lbl{flex:none;width:46px}
.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px 15px;justify-content:flex-start;padding:3px 0}
.chip{flex:none;width:22px;height:22px;border-radius:6px;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.chip.on{outline:2px solid #fff;outline-offset:2px}
.nick input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #333;background:var(--panel);color:var(--fg);font:inherit;font-size:15px}
.cta{margin-top:12px;background:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#0a0a0a;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.on{opacity:1}
#toast.mid{bottom:auto;top:50%;transform:translate(-50%,-50%)}
</style>
</head>

<script>
/* ====================================================================
   ALGORITHMS (pure functions — Node 로 테스트 가능)
   ==================================================================== */
// ==ALGO-START==
const G = 9.80665;
// 실제 기기 테스트 후 여기 숫자만 조정하면 돼요.
const TUNE = {
  jump:   { lowTh:4.5, highTh:7.5, takeoffTh:10.5, takeoffWindow:0.6, minFlight:0.16, maxFlight:1.0, mergeGap:90, minCm:10, maxCm:60 },
  react:  { rounds:6, minValid:100, maxWait:2500, minDelay:1500, maxDelay:4500, bestMs:180, worstMs:720 },
  balance:{ accBest:0.05, accWorst:1.4, gyroBest:1.0, gyroWorst:14, touchPeakGyro:60, touchPeakAcc:2.5, legSec:15, prepSec:5, switchSec:7 },
  sprint: { seconds:15, fcHz:2.8, minAmp:6, k:0.35, minPeriod:250, minCount:18, maxCount:64 },
  punch:  { floor:12, k:0.6, minGap:170, seconds:10, minPeak:12, maxPeak:60, minCount:8, maxCount:35, wPeak:0.6 },
  shout:  { minDb:-42, maxDb:-6 }
};
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp01(v,lo,hi){ return clamp((v-lo)/(hi-lo),0,1); }
function toScore(x01){ return Math.round(clamp(x01,0,1)*100); }

/* 점프: 가속도 크기(중력 포함)가 0 근처로 떨어지는 '무중력 구간'의 길이 = 체공시간. h = g·t²/8 */
function createJumpDetector(opts){
  const o = Object.assign({}, TUNE.jump, opts);
  let state='ground', tLow=0, lastSpike=-1e9, pend=null; const jumps=[];
  // 착지로 보이는 순간 바로 확정하지 않고 mergeGap(ms) 동안 기다려요.
  // 손에 쥔 폰은 체공 중에 값이 잠깐 튀어 구간이 끊길 수 있는데, 곧바로 다시 '무중력'이 이어지면 같은 점프로 합쳐요.
  const settle=()=>{
    const p=pend; pend=null;
    const flight=(p.t-p.tLow)/1000;
    if(flight>=o.minFlight && flight<=o.maxFlight && (p.tLow-p.spike)/1000<=o.takeoffWindow){
      const j={ t:p.t, flight, height: G*flight*flight/8*100 };
      jumps.push(j); return j;
    }
    return null;
  };
  return {
    push(s){
      const m=s.mag, t=s.t; let out=null;
      if(pend && m>=o.lowTh && t-pend.t>o.mergeGap) out=settle();
      if(state==='ground'){
        if(m>o.takeoffTh && !pend) lastSpike=t;
        if(m<o.lowTh){
          state='air';
          if(pend && t-pend.t<=o.mergeGap){ tLow=pend.tLow; lastSpike=pend.spike; pend=null; } else { if(pend) out=settle()||out; tLow=t; }
        }
      } else if(m>o.highTh){
        state='ground'; pend={ tLow, t, spike:lastSpike };
      }
      return out;
    },
    get jumps(){ return jumps; }
  };
}
function jumpScore(cm){ return toScore(lerp01(cm, TUNE.jump.minCm, TUNE.jump.maxCm)); }

/* 리액션 탭: 4라운드 평균·최고 + 등급 + 내 기기 랭킹 */
function reactionScore(ms){ const r=TUNE.react; return toScore(lerp01(r.worstMs-ms, 0, r.worstMs-r.bestMs)); }
function summarizeReaction(rounds){
  const ok=rounds.filter(r=>r.ms!=null).map(r=>r.ms);
  if(!ok.length) return {valid:0, avg:null, best:null, score:0};
  const avg=ok.reduce((a,b)=>a+b,0)/ok.length;
  return {valid:ok.length, avg, best:Math.min(...ok), score:reactionScore(avg)};
}
function addRanking(list, entry, max){
  const pos=list.filter(e=>e.avg<entry.avg).length+1;
  const next=list.concat([entry]).sort((a,b)=>a.avg-b.avg).slice(0,max||20);
  return {list:next, pos};
}

/* 한발 밸런스: 1초 단위로 가속도 분산 + 자이로 RMS 를 흔들림으로 환산. 발이 땅에 닿는 큰 충격이 나오면 거기까지만 측정 */
function variance(a){ if(a.length<2) return 0; let m=0; for(const v of a) m+=v; m/=a.length; let s=0; for(const v of a) s+=(v-m)*(v-m); return s/a.length; }
function bucketWobble(samples){
  if(samples.length<5) return null;
  const acc=Math.sqrt(variance(samples.map(s=>s.ax))+variance(samples.map(s=>s.ay))+variance(samples.map(s=>s.az)));
  const gs=samples.filter(s=>s.gm!=null && !isNaN(s.gm));
  let gyro=null, peakGyro=0; if(gs.length>=5){ let q=0; for(const s of gs){ q+=s.gm*s.gm; if(s.gm>peakGyro) peakGyro=s.gm; } gyro=Math.sqrt(q/gs.length); }
  const mags=samples.map(s=>Math.hypot(s.ax,s.ay,s.az)); let mm=0; for(const v of mags) mm+=v; mm/=mags.length;
  let peakAcc=0; for(const v of mags){ const d=Math.abs(v-mm); if(d>peakAcc) peakAcc=d; }
  return { acc, gyro, peakAcc, peakGyro };
}
function stability01(w){
  const p=TUNE.balance; const parts=[1-lerp01(w.acc,p.accBest,p.accWorst)];
  if(w.gyro!=null) parts.push(1-lerp01(w.gyro,p.gyroBest,p.gyroWorst));
  return parts.reduce((a,b)=>a+b,0)/parts.length;
}
function balanceSummary(buckets, legSec){
  const p=TUNE.balance, secs=legSec||p.legSec; let hold=buckets.length;
  for(let i=0;i<buckets.length;i++){
    const w=buckets[i];
    if(w && (w.peakAcc>p.touchPeakAcc || w.peakGyro>p.touchPeakGyro)){ hold=i; break; }
  }
  const stabs=buckets.slice(0,hold).filter(Boolean).map(stability01);
  const steady=stabs.length ? stabs.reduce((a,b)=>a+b,0)/stabs.length : 0;
  return {
    hold, touched: hold<buckets.length,
    steady: Math.round(steady*100),
    score: toScore(steady*Math.min(hold,secs)/secs),
    wobble: buckets.map(w=> w ? 1-stability01(w) : 0)
  };
}

/* 제자리 팔치기: 손에 쥔 폰이 앞뒤로 왕복한 횟수.
   3축 선형가속도 → 저역통과(발 착지 충격 제거) → 가장 크게 흔들리는 축을 자동으로 찾아 투영 → 히스테리시스로 왕복 1회씩 셈.
   폰을 어느 방향으로 쥐어도 되고, 뛰지 않고 팔만 흔들어도 셈 */
function createSwingCounter(opts){
  const c=Object.assign({}, TUNE.sprint, opts);
  const RC=1/(2*Math.PI*c.fcHz);
  const s1=[0,0,0], s2=[0,0,0], mu=[0,0,0], C=[0,0,0,0,0,0,0,0,0];
  const nrm=v=>{ const n=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/n,v[1]/n,v[2]/n]; };
  let e=nrm([0.80,0.45,0.40]), tPrev=null, n=0, env=c.minAmp/c.k, state=0, lastCross=-1e9, cycles=0;
  return {
    push(s){
      let dt=tPrev==null?16.7:s.t-tPrev; tPrev=s.t; dt=clamp(dt,4,60); n++;
      const a=dt/(RC+dt), x=[s.lx,s.ly,s.lz];
      for(let i=0;i<3;i++){ s1[i]+=a*(x[i]-s1[i]); s2[i]+=a*(s1[i]-s2[i]); }
      const b=Math.max(dt/1500, 1/(n+1));                    // 처음엔 빨리, 이후엔 약 1.5초 기억
      for(let i=0;i<3;i++) mu[i]+=b*(s2[i]-mu[i]);

      for(let i=0;i<3;i++) for(let j=0;j<3;j++) C[i*3+j]+=b*(v[i]*v[j]-C[i*3+j]);

      if(u>h){ if(state===-1 && s.t-lastCross>=c.minPeriod){ cycles++; lastCross=s.t; counted=true; } state=1; }

/* 펀치 스피드: 선형 가속도(중력 제외) 크기의 피크 = 펀치 1회. 한 펀치 안에서 더 큰 피크가 나오면 그 값으로 갱신(합침) */
function createLinearAccel(alpha){
  // 기기가 중력 제외 가속도를 안 줄 때: 느린 저역통과로 중력을 추정해 빼요
  const k=alpha||0.02; let gx=null, gy=0, gz=0;
  const vec=(ax,ay,az)=>{ if(gx===null){ gx=ax; gy=ay; gz=az; } gx+=k*(ax-gx); gy+=k*(ay-gy); gz+=k*(az-gz); return [ax-gx, ay-gy, az-gz]; };
  return { vec, push(ax,ay,az){ const v=vec(ax,ay,az); return Math.hypot(v[0],v[1],v[2]); } };
}
function createPunchDetector(opts){
  const c=Object.assign({}, TUNE.punch, opts);
  let p2=0, p1=0, tp1=0, last=-1e9, amp=c.floor/c.k, n=0; const punches=[];
  return {
    push(s){
      const x=s.lm; n++;
      amp=Math.max(c.floor/c.k, amp*0.998);
      let hit=null;
      if(n>=3 && p1>p2 && p1>=x){
        const thr=Math.max(c.floor, c.k*amp);
        if(p1>thr){
          if(tp1-last>=c.minGap){ last=tp1; amp+=0.3*(p1-amp); hit={t:tp1, peak:p1}; punches.push(hit); }
          else if(punches.length && p1>punches[punches.length-1].peak){ const lp=punches[punches.length-1]; amp+=0.3*(p1-lp.peak); lp.peak=p1; }
        }
      }

      return hit;
    },
    get punches(){ return punches; }
  };
}
function summarizePunch(punches){
  const T=TUNE.punch, n=punches.length;
  if(!n) return { count:0, peak:0, avg:0, peakIdx:-1, peakG:0, avgG:0, perSec:0, peakScore:0, countScore:0, score:0 };
  const peaks=punches.map(p=>p.peak), peak=Math.max(...peaks), avg=peaks.reduce((a,b)=>a+b,0)/n;
  const peakScore=toScore(lerp01(peak,T.minPeak,T.maxPeak)), countScore=toScore(lerp01(n,T.minCount,T.maxCount));
  return { count:n, peak, avg, peakIdx:peaks.indexOf(peak), peakG:peak/G, avgG:avg/G, perSec:n/T.seconds,
    peakScore, countScore, score:Math.round(T.wPeak*peakScore+(1-T.wPeak)*countScore) };
}

/* 상위 N%: 연구 자료(임시) 또는 실제 사용자 기록 */
const PCT={

  fullN:50,                                  // 이 수 이상이면 실제 사용자 기록만 사용
  dir:{reaction:'low', balance:'high', jump:'high', sprint:'high', punch:'high', shout:'high'},
  sexSplit:['jump'],
  research:{
    // 반응속도: 연구 자료(Woods 외 2015 표, 평균 261ms, 표준편차 47ms)에서 출발했지만, 폰 터치 지연을 고려해 평균을 430ms로 직접 설정(표준편차 47ms 유지)
    reaction:{type:'normal', mean:430, sd:47},
    // 한발 밸런스(눈 감고): Springer 외 2007, 18~39세 3회 평균 9.4초(표준편차 9.4) → 한쪽으로 치우친 분포라 로그정규로 근사
    balance:{type:'lognormal', mean:9.4, sd:9.4},
    // 점프(cm): 캐나다 국민건강조사 20~24세, 힘판·팔 스윙 허용(2차 자료의 P5/P50/P95). P5·P50·P95를 지나게 근사
    jump:{type:'sex', m:{p5:32.6,p50:49.4,p95:63.8}, f:{p5:22.8,p50:31.8,p95:41.4}}
  }
};
function normCdf(z){
  const x=Math.abs(z)/Math.SQRT2, t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return 0.5*(1+(z<0?-y:y));
}
function researchCdf(event, v, sex){
  const r=PCT.research[event]; if(!r || v==null || !isFinite(v)) return null;
  if(r.type==='normal') return normCdf((v-r.mean)/r.sd);
  if(r.type==='lognormal'){
    const s2=Math.log(1+(r.sd*r.sd)/(r.mean*r.mean)), mu=Math.log(r.mean)-s2/2;
    return normCdf((Math.log(Math.max(v,0.3))-mu)/Math.sqrt(s2));
  }
  if(r.type==='sex'){
    const one=g=>normCdf((v-g.p50)/((v<g.p50?g.p50-g.p5:g.p95-g.p50)/1.645));   // 중앙값 기준 좌우 따로 맞춘 정규분포: P5·P50·P95를 정확히 지나요
    if(sex==='m') return one(r.m); if(sex==='f') return one(r.f);
    return 0.5*one(r.m)+0.5*one(r.f);      // 성별 미선택: 남녀 통합
  }
  return null;
}
function researchTop(event, v, sex){
  const c=researchCdf(event,v,sex); if(c==null) return null;
  return clamp(Math.round((PCT.dir[event]==='low'?c:1-c)*100),1,99);
}
function realTop(event, st, sex){
  if(!st) return null;
  let n=st.n, lo=st.lower, eq=st.eq;
  if(PCT.sexSplit.includes(event) && (sex==='m'||sex==='f') && st.sexN>=PCT.minN){ n=st.sexN; lo=st.sexLower; eq=st.sexEq; }
  if(!(n>=PCT.minN)) return null;
  const hi=n-lo-eq;
  const beaten=PCT.dir[event]==='low' ? (hi+0.5*eq)/n : (lo+0.5*eq)/n;
  return { p:clamp(Math.round((1-beaten)*100),1,99), n };
}
function blendTop(real, researchP){
  if(!real) return null;
  if(real.n>=PCT.fullN || researchP==null) return { p:real.p, n:real.n, src:'real' };   // 연구 자료가 없는 종목은 30건부터 실제 기록만
  const w=real.n/PCT.fullN;                                                               // 30건 0.6 → 49건 0.98 (50건에서 1.0으로 이어져요)
  return { p:clamp(Math.round((1-w)*researchP+w*real.p),1,99), n:real.n, src:'mix' };
}
function overallTop(list){
  const v=list.filter(x=>x!=null); if(v.length<2) return null;
  return Math.round(v.reduce((a,b)=>a+b,0)/v.length);
}

/* ---------- screens ---------- */
function show(id){ ['home','event','final'].forEach(s=>{ $('#'+s).hidden = (s!==id); }); window.scrollTo(0,0); }
let current=null, curEv=null, runId=0;
function makeCtx(){
  const id=++runId, cleanups=[];
  const ctx={
    alive:()=>id===runId,
    check(){ if(id!==runId) throw CANCEL; },
    wait(ms){ return new Promise((res,rej)=>setTimeout(()=>id===runId?res():rej(CANCEL),ms)); },
    view(html){ if(id===runId) $('#stage').innerHTML=html; },
    cleanup(fn){ cleanups.push(fn); },
    end(){ while(cleanups.length){ try{ cleanups.pop()(); }catch(e){} } }
  };
  return ctx;
}
function cancelRun(){ runId++; if(current){ current.end(); current=null; } Sensors.sink=null; }

function renderHome(){
  const list=$('#evList'); list.innerHTML='';
  EVENTS.forEach(ev=>{
    const done=state.scores[ev.id]!=null;
    const b=document.createElement('button'); b.className='evcard'+(done?' done':'');
    b.innerHTML=`<span class="evico">${ev.icon}</span><span class="evtxt"><b>${ev.name}</b><small>${ev.tag}</small></span><span class="evstat">${done?`<em>${state.scores[ev.id]}</em><small>${state.labels[ev.id]||''}</small>`:`<small>${ev.optional?'선택':''}</small>`}</span>`;
    b.onclick=()=>openEvent(ev);
    list.appendChild(b);
  });
  const n=Object.keys(state.scores).length, rd=reqDone();
  $('#progFill').style.width=(n/EVENTS.length*100)+'%';
  $('#progText').textContent=n+' / '+EVENTS.length;
  $('#startBtn').textContent = n===0?'측정 시작' : rd<REQ.length?'이어서 측정하기' : '내 운동 능력 확인';
  $('#startBtn').classList.toggle('white', n>0 && rd>=REQ.length);   // '내 운동 능력 확인' 상태일 때 같은 흰색 스타일
  $('#viewCard').hidden = !(n>=1 && rd<REQ.length);   // 1개만 재도 중간 결과 카드를 볼 수 있어요
  $('#demoBadge').hidden=!state.demo;
  $('#demoBtn').textContent = state.demo ? '체험 모드 끄기' : '체험 모드(센서 없이 둘러보기)';
  $('#resetHome').hidden = n===0;
}

function openEvent(ev,fresh){
  cancelRun(); curEv=ev; show('event');
  $('#evTitle').textContent=ev.name;
  $('#evStep').textContent=(EVENTS.indexOf(ev)+1)+' / '+EVENTS.length;
  const saved=state.results[ev.id];
  if(!fresh && state.scores[ev.id]!=null && saved){ track('motionlab_event_view_result',{event_id:ev.id}); showResult(ev,saved); return; }   // 이미 잰 종목은 저장된 결과를 보여줘요
  $('#stage').innerHTML=`<div class="intro"><h2>${ev.name}</h2><p class="lead">${ev.tag}</p><ol class="how">${ev.how.map((h,i)=>`<li>${h}</li>`+(ev.id==='jump'&&i===0?`<li class="sx">${sexPickHtml()}</li>`:'')).join('')}</ol><p class="warn">주의 · ${ev.warn}</p><button class="btn" id="goBtn">준비됐어요</button></div>`;

async function begin(ev){
  audio(); // 제스처 안에서 오디오 잠금 해제
  if(ev.needs==='motion' && !state.demo){
    const st=await Sensors.ensure();
    if(st!=='ok'){ showSensorError(ev, st); return; }
  }
  launch(ev);
}

function showSensorError(ev, code){
  const msgs={
    denied:['동작 센서 권한이 꺼져 있어요','이 기능은 폰의 동작 센서를 써요. iPhone은 설정 → Safari → "동작 및 방향 접근"을 켜고 새로고침해 주세요. Android는 사이트 설정에서 "동작 센서"를 허용해 주세요.'],
    none:['동작 센서를 찾지 못했어요','PC이거나, 센서를 막은 브라우저일 수 있어요. 폰의 Safari/Chrome에서 https 주소로 열어주세요. 지금은 체험 모드로 화면과 결과 카드를 먼저 볼 수 있어요.'],
    mic:['마이크 권한이 필요해요','브라우저의 마이크 허용을 켜고 다시 시도해 주세요. 소리는 기기 안에서 크기만 재고 저장하지 않아요.']
  };
  const m=msgs[code]||msgs.none;
  $('#stage').innerHTML=`<div class="errbox"><h3>${m[0]}</h3>${m[1]}</div><div class="btnrow"><button class="btn ghost" id="errBack">뒤로</button><button class="btn" id="errDemo">체험 모드로 계속</button></div>`;
  $('#errBack').onclick=()=>{ renderHome(); show('home'); };
  $('#errDemo').onclick=()=>{ state.demo=true; launch(ev); };
  track('motionlab_sensor_error',{event_id:ev.id,code});
}

async function launch(ev){
  cancelRun();
  const ctx=makeCtx(); current=ctx;
  track('motionlab_event_start',{event_id:ev.id,demo:state.demo});
  try{
    let res;
    if(state.demo && ev.id!=='reaction') res=await runDemo(ctx,ev);
    else res=await RUNNERS[ev.id](ctx);
    ctx.check();
    ctx.end();
    state.scores[ev.id]=res.score; state.labels[ev.id]=res.label; try{ state.results[ev.id]=JSON.parse(JSON.stringify(res)); }catch(e){} applyResearchPct(ev.id,res.metric); persist(); syncServer(ev.id,res.metric);
    track('motionlab_event_complete',{event_id:ev.id,score:res.score,demo:state.demo});
    showResult(ev,res);
  }catch(e){
    ctx.end();
    if(e===CANCEL) return;
    if(e && e.code){ showSensorError(ev,e.code); return; }
    console.error(e);
    $('#stage').innerHTML=`<div class="errbox"><h3>측정 중 문제가 생겼어요</h3>잠시 후 다시 시도해 주세요.</div><button class="btn" id="errRetry" style="margin-top:12px">다시 시도</button>`;
    $('#errRetry').onclick=()=>openEvent(ev,true);
  }
}

function tierText(s){
  return s>=95?'역대급이에요. 진짜 사람 맞아요?'
    :s>=85?'최상위권이에요. 좀 치시는데요?'
    :s>=75?'상위권이에요. Good.'
    :s>=65?'꽤 잘해요. 평균 이상!'
    :s>=50?'나쁘지 않아요. 평균 정도?'
    :s>=40?'평균에 살짝 못 미쳐요. 조금만 더!'
    :s>=25?'아직 제대로 안한거 같은데?'
    :s>=10?'조금 더 집중해서 다시 해볼까요?'
    :'결과가 이상해요. 다시 측정해주세요.';
}
function buildJump(found){
  const best=found.length?Math.max(...found.map(j=>j.height)):0;
  const bestFlight=found.length?Math.max(...found.map(j=>j.flight)):0;
  return { metric:best?Math.round(best*10)/10:null, score:jumpScore(best), main:best?best.toFixed(1):'—', unit:'cm', label:best?best.toFixed(1)+'cm':'—',
    note: best?'':'점프가 감지되지 않았어요. 폰을 더 꽉 쥐거나 주머니에 넣고 다시 시도해 보세요.',
    sub: found.map((j,i)=>[(i+1)+'번째 점프', j.height.toFixed(1)+' cm']).concat(best?[['최대 체공시간', bestFlight.toFixed(2)+' s']]:[]) };
}
const RK_KEY='kye3_motionlab_rx_v1';
function loadRank(){ try{ const j=JSON.parse(localStorage.getItem(RK_KEY)||'[]'); return Array.isArray(j)?j:[]; }catch(e){ return []; } }
function saveRank(l){ try{ localStorage.setItem(RK_KEY,JSON.stringify(l)); }catch(e){} }
function buildReaction(rounds){
  const S=summarizeReaction(rounds), T=TUNE.react;
  const avg=S.avg!=null?Math.round(S.avg):null, best=S.best!=null?Math.round(S.best):null;
  let extra='', note='';
  if(!S.valid) note='유효한 기록이 없어요. 원이 나타난 뒤에 터치하세요.';
  else {
    if(S.valid<T.rounds) note='유효 기록 '+S.valid+'/'+T.rounds+'회.';
  }
  return { metric:(S.valid>=3&&avg!=null)?avg:null, score:S.score, main:avg!=null?String(avg):'—', unit:'ms 평균', label:avg!=null?'평균 '+avg+'ms':'—', note, extra,
    sub:[['평균 반응속도',avg!=null?avg+' ms':'—'],['최고 기록',best!=null?best+' ms':'—']].concat(rounds.map((r,i)=>['ROUND '+(i+1), r.ms!=null?Math.round(r.ms)+' ms':(r.falseStart?'부정 출발':'반응 없음')])) };
}
function buildBalance(legs){
  const T=TUNE.balance, names=['왼발','오른발'];
  const score=Math.round((legs[0].score+legs[1].score)/2);
  const diff=Math.abs(legs[0].score-legs[1].score), better=legs[0].score>=legs[1].score?'왼발':'오른발';
  const notes=[]; legs.forEach((s,i)=>{ if(s.touched) notes.push(names[i]+'은 '+s.hold+'초에 발이 땅에 닿았어요.'); });
  const holdAvg=Math.round((Math.min(legs[0].hold,T.legSec)+Math.min(legs[1].hold,T.legSec))/2*10)/10;
  return { metric:holdAvg, score, main:String(score), unit:'점', label:'좌 '+legs[0].score+' · 우 '+legs[1].score, note:notes.join(' '),
    sub: legs.map((s,i)=>[names[i], s.score+'점 · 안정 '+s.steady+'% · '+Math.min(s.hold,T.legSec)+'/'+T.legSec+'s']).concat([['좌우 차이', diff<=5?'거의 같아요':better+'이 '+diff+'점 더 안정적']]) };
}
function buildSprint(cycles){
  const T=TUNE.sprint, hz=cycles/T.seconds;
  return { metric:cycles, score:sprintScore(cycles), main:String(cycles), unit:'회 (앞뒤 왕복)', label:cycles+'회',
    note: cycles<8?'폰이 거의 흔들리지 않았어요. 폰을 꽉 쥐고 팔을 더 크게 앞뒤로 흔들어 보세요.':'',
    sub:[['초당 왕복', hz.toFixed(1)+' 회']] };
}
function buildPunch(punches){
  const S=summarizePunch(punches), T=TUNE.punch;
  const g1=v=>v.toFixed(1);
  const disclaimer='<p class="fine" style="margin:12px 2px 0">※ 휴대폰이 느낀 가속도를 측정한 상대 지표에요.</p>';
  if(!S.count) return { score:0, main:'—', unit:'G', label:'—', extra:disclaimer,
    note:'펀치가 감지되지 않았어요. 폰을 손목에 더 단단히 고정하고, 조금 더 빠르게 휘둘러 보세요.', sub:[['펀치 횟수','0 회']] };
  return { metric:S.score, score:S.score, main:g1(S.peakG), unit:'G', label:g1(S.peakG)+'G · '+S.count+'회', extra:disclaimer, note:'',
    sub:[['가장 빠른 펀치', (S.peakIdx+1)+'번째 · '+g1(S.peakG)+' G'],['펀치 횟수', S.count+' 회'],['초당 펀치', S.perSec.toFixed(1)+' 회']] };
}
function shoutLevel(d){ const r=relDb(d); return r>=92?'체육관이 울려요':r>=84?'역도장 기합급':r>=72?'응원 소리':r>=60?'대화보다 조금 큰 정도':'속삭임에 가까워요'; }
function buildShout(d){
  const r=relDb(d);
  return { metric:Math.max(0,r), score:shoutScore(d), main:String(Math.max(0,r)), unit:'dB', label:Math.max(0,r)+'dB',
    note: d<-70?'소리가 거의 잡히지 않았어요. 마이크 가까이에서 다시 질러보세요.':'',
    sub:[['등급', shoutLevel(d)],['기기 마이크 기준값', 'dBFS '+d.toFixed(1)]] };
}

RUNNERS.jump=async function(ctx){

  beep(988,0.2); buzz(80);

  await new Promise(resolve=>{
    const t0=performance.now(); let fin=false, iv=null;
    const finish=()=>{ if(fin) return; fin=true; Sensors.sink=null; clearInterval(iv); resolve(); };
    iv=setInterval(()=>{ const left=Math.max(0,15-(performance.now()-t0)/1000); const el=$('#jmTime'); if(el) el.textContent=Math.ceil(left); if(left<=0) finish(); },200);
    ctx.cleanup(finish);

function reactionRound(ctx){
  return new Promise(resolve=>{
    const T=TUNE.react, rx=$('#rx'), msg=$('#rxm'), tgt=$('#tgt'), sub=rx.querySelector('.rxs');
    let phase='wait', goT=0; const timers=[];
    const finish=o=>{ if(phase==='done') return; phase='done'; rx.onpointerdown=null; tgt.onpointerdown=null; timers.forEach(clearTimeout); resolve(o); };
    ctx.cleanup(()=>finish({cancelled:true}));
    rx.onpointerdown=()=>{ if(phase==='wait') finish({falseStart:true}); };
    tgt.onpointerdown=e=>{
      e.stopPropagation();
      if(phase!=='go') return;
      const ms=performance.now()-goT;
      finish(ms<T.minValid?{falseStart:true}:{ms});
    };
    const delay=T.minDelay+Math.random()*(T.maxDelay-T.minDelay);
    timers.push(setTimeout(()=>{
      if(phase!=='wait') return;
      const S=104, w=rx.clientWidth, h=rx.clientHeight;
      tgt.style.left=Math.round(Math.random()*Math.max(0,w-S))+'px';
      tgt.style.top=Math.round(Math.random()*Math.max(0,h-S))+'px';
      tgt.hidden=false; msg.style.visibility='hidden'; sub.textContent='지금 터치!';
      phase='armed';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(phase==='armed'){ goT=performance.now(); phase='go'; } }));
      timers.push(setTimeout(()=>finish({miss:true}),T.maxWait));
    },delay));
  });
}
RUNNERS.reaction=async function(ctx){
  const T=TUNE.react, rounds=[];
  await countdown(ctx,5,'폰을 들고<br>화면을 바라봐요','시작!');
  for(let r=1;r<=T.rounds;r++){
    ctx.view(`<div class="react" id="rx"><div class="rxr">ROUND ${r} / ${T.rounds}</div><div class="rxm" id="rxm">기다려요…</div><div class="rxs">원이 나타나면 최대한 빨리 터치!<br>미리 누르면 부정 출발</div><button class="tgt" id="tgt" hidden>TAP</button></div>`);
    const o=await reactionRound(ctx);
    ctx.check();
    rounds.push(o);
    const rx=$('#rx'), msg=$('#rxm'), sub=rx.querySelector('.rxs');
    $('#tgt').hidden=true; msg.style.visibility='visible'; sub.textContent='';
    if(o.ms!=null){ msg.textContent=Math.round(o.ms)+' ms'; }
    else { rx.className='react bad'; msg.textContent=o.falseStart?'부정 출발!':'반응 없음'; buzz(120); }
    await ctx.wait(1200);
  }
  return buildReaction(rounds);
};

RUNNERS.balance=async function(ctx){
  const T=TUNE.balance, names=['왼발','오른발'], sums=[], V=0.4; // 눈을 감고 듣는 신호라 소리를 조금 크게

    }
    if(li===0) await goWord(ctx,'시작!');
    beep(1175,0.6,0.45); buzz(300); // 눈 감기 신호
    ctx.view(`<div class="measure"><div class="eyebrow">${li+1} / 2</div><div class="status dim">눈 감고<br>${names[li]}로 버텨요</div><div class="fine" id="blMsg" style="min-height:20px;margin:14px 0 0"></div><button class="btn" id="blNext" disabled style="margin-top:10px">다음 단계로 넘어가기</button></div>`);
    const buckets=[]; let cur=[];
    await new Promise(resolve=>{
      let sec=0, iv=null, iv2=null, fin=false, touchIdx=-1, early=null;
      const finish=()=>{ if(fin) return; fin=true; Sensors.sink=null; clearInterval(iv); clearInterval(iv2); resolve(); };
      ctx.cleanup(finish);
      const isT=w=>!!w && (w.peakAcc>T.touchPeakAcc || w.peakGyro>T.touchPeakGyro);
      // 발이 땅에 닿은 충격이 감지되면 '다음 단계로 넘어가기' 버튼을 켜요
      const mark=w=>{
        if(touchIdx>=0) return; touchIdx=buckets.length; early=w;
        const b=document.getElementById('blNext'), m=document.getElementById('blMsg');
        if(b) b.disabled=false; if(m) m.textContent='발이 땅에 닿았어요. 준비되면 넘어가세요.';
      };
      const nb=document.getElementById('blNext');
      if(nb) nb.onclick=()=>{ if(touchIdx<0) return; if(touchIdx===buckets.length) buckets.push(early); finish(); };
      Sensors.sink=s=>cur.push(s);
      iv2=setInterval(()=>{ if(touchIdx<0){ const w=bucketWobble(cur); if(isT(w)) mark(w); } },200);
      iv=setInterval(()=>{
        const w=bucketWobble(cur); if(isT(w)) mark(w);
        buckets.push(touchIdx===buckets.length?early:w); cur=[]; sec++;
        if(sec<T.legSec) beep(660,0.1,V);   // 1초마다 '삐'
        if(sec>=T.legSec) finish();
      },1000);
    });
    ctx.check();
    sums.push(balanceSummary(buckets,T.legSec));
    beep(1175,0.15,0.45); setTimeout(()=>beep(1175,0.5,0.45),220); buzz([150,80,300]); // 눈 뜨기 신호
  }
  return buildBalance(sums);
};

RUNNERS.shout=async function(ctx){
  let stream=null, ac2=null;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){ throw {code:'mic'}; }
  ctx.cleanup(()=>{ try{stream.getTracks().forEach(t=>t.stop());}catch(e){} try{ac2&&ac2.close();}catch(e){} });
  const AcCls=window.AudioContext||window.webkitAudioContext; ac2=new AcCls();
  try{ await ac2.resume(); }catch(e){}
  const an=ac2.createAnalyser(); an.fftSize=1024;
  ac2.createMediaStreamSource(stream).connect(an);
  const f32=new Float32Array(an.fftSize), u8=new Uint8Array(an.fftSize);
  const readRms=()=>{
    let q=0;
    if(an.getFloatTimeDomainData){ an.getFloatTimeDomainData(f32); for(let i=0;i<f32.length;i++) q+=f32[i]*f32[i]; return Math.sqrt(q/f32.length); }
    an.getByteTimeDomainData(u8); for(let i=0;i<u8.length;i++){ const v=(u8[i]-128)/128; q+=v*v; } return Math.sqrt(q/u8.length);
  };
  await countdown(ctx,5,'폰을 입에서 한 뼘 거리로','함성!');
  ctx.view(`<div class="measure"><div class="status">함성!!!</div><div class="bignum"><span id="shN">0</span><small>dB</small></div><div class="meter"><i id="shBar"></i><u id="shPk"></u></div><div class="timer" id="shT">5</div></div>`);
  beep(1175,0.25); buzz(150);
  let peak=-120; const ring=[]; const t0=performance.now();
  await new Promise(resolve=>{
    const tick=()=>{
      if(!ctx.alive()) return resolve();
      const now=performance.now(); const r=readRms();
      ring.push(r*r); if(ring.length>3) ring.shift();
      const d=dbfs(Math.sqrt(ring.reduce((a,b)=>a+b,0)/ring.length));
      if(d>peak) peak=d;
      const n=$('#shN'); if(n) n.textContent=Math.max(0,relDb(d));
      const bar=$('#shBar'); if(bar) bar.style.width=(lerp01(d,TUNE.shout.minDb,TUNE.shout.maxDb)*100)+'%';
      const pk=$('#shPk'); if(pk) pk.style.left=(lerp01(peak,TUNE.shout.minDb,TUNE.shout.maxDb)*100)+'%';
      const t=$('#shT'); if(t) t.textContent=Math.max(0,Math.ceil(5-(now-t0)/1000));
      if(now-t0>=5000) return resolve();
      requestAnimationFrame(tick);
    };
    tick();
  });
  ctx.check();
  return buildShout(peak);
};

/* ---------- demo (센서 없을 때 화면/카드 확인용) ---------- */
async function runDemo(ctx,ev){
  ctx.view(`<div class="cd"><div class="cdl">체험 측정 중…</div><div class="cdn">…</div></div>`);
  await ctx.wait(1300);
  const r=Math.random;
  switch(ev.id){
    case 'jump':{ const h=24+r()*28; return buildJump([{height:h*0.92,flight:Math.sqrt(8*h*0.92/100/G)},{height:h,flight:Math.sqrt(8*h/100/G)},{height:h*0.96,flight:Math.sqrt(8*h*0.96/100/G)}]); }
    case 'balance':{ const leg=()=>{ const b=[]; for(let i=0;i<TUNE.balance.legSec;i++) b.push({acc:0.1+r()*0.5,gyro:1+r()*5}); return balanceSummary(b); }; return buildBalance([leg(),leg()]); }
    case 'sprint': return buildSprint(Math.round(36+r()*24));
    case 'punch':{ const n=16+Math.floor(r()*14), base=22+r()*20, ps=[]; for(let i=0;i<n;i++) ps.push({t:i*300,peak:base*(0.7+r()*0.3)}); ps[Math.floor(r()*n)].peak=base*1.1; return buildPunch(ps); }
    case 'shout': return buildShout(-40+r()*30);
  }
}

/* ---------- final card ---------- */
function wrapLines(c,text,maxW){
  const words=text.split(' '); const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(c.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line); return lines;
}
function drawCard(){
  const cv=$('#card'), c=cv.getContext('2d'); const W=1080,H=1350;
  const FONT='"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,"Segoe UI",sans-serif';
  const AC=ACCENTS[state.accent]||ACCENTS.lime, ACC=AC.c, LT=!!AC.light;
  const hx=(a)=>{ const n=parseInt(ACC.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
  const TH=LT?{bg:'#f0f0f0',fg:'#111',g1:'#b4b4b4',g2:'#d2d2d2',date:'#4a4a4a',pct:'#4a4a4a',desc:'#3a3a3a',none:'#8a8a8a'}:{bg:'#0a0a0a',fg:'#fff',g1:'#3a3a3a',g2:'#262626',date:'#8a8a8a',pct:'#bdbdbd',desc:'#cfcfcf',none:'#6f6f6f'};
  const AX=AXES.filter(a=>state.scores[a.id]!=null || a.id!==OPT.id), sc=AX.map(a=>state.scores[a.id]!=null?state.scores[a.id]:null);   // 필수 5축은 항상 그리고, 아직 안 잰 축은 '-'로 표시
  const cls=classify(state.scores), T=TYPES[cls.typeKey];
  const d=new Date(); const dateStr=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
  c.clearRect(0,0,W,H);
  c.fillStyle=TH.bg; c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W*0.85,120,0,W*0.85,120,720); g.addColorStop(0,hx(LT?0.42:0.16)); g.addColorStop(1,hx(0)); c.fillStyle=g; c.fillRect(0,0,W,H);
  // 카드 테두리(저장·공유 이미지에도 들어가도록 이미지 안에 그려요)
  { const bx=1.5,by=1.5,bw=W-3,bh=H-3,r=52; c.beginPath(); c.moveTo(bx+r,by); c.arcTo(bx+bw,by,bx+bw,by+bh,r); c.arcTo(bx+bw,by+bh,bx,by+bh,r); c.arcTo(bx,by+bh,bx,by,r); c.arcTo(bx,by,bx+bw,by,r); c.closePath(); c.strokeStyle=hx(LT?0.35:0.28); c.lineWidth=3; c.stroke(); }
  c.textBaseline='alphabetic';
  // header
  c.textAlign='left'; c.fillStyle=ACC; c.font=`700 30px ${FONT}`; c.fillText('MOTION LAB',72+Math.round(c.measureText('MOTION LAB').actualBoundingBoxLeft||0),111);   // 왼쪽 상단에는 MOTION LAB만 (왼쪽 끝은 아래 알약·글자와 같은 선)
  c.textAlign='right'; c.fillStyle=TH.date; c.font=`500 30px ${FONT}`; c.fillText(dateStr,W-72,111);
  const inkL=(t)=>{ const m=c.measureText(t); return (m.actualBoundingBoxLeft!=null)?Math.round(m.actualBoundingBoxLeft):0; };   // 글자 모양마다 다른 왼쪽 여백을 없애서, 눈에 보이는 글자 왼쪽 끝을 알약 테두리(72px)와 맞춰요
  const hasN=!!state.name;
  c.font=`500 34px ${FONT}`; const dl=wrapLines(c,T.desc,W-144).slice(0,2);
  // 로고는 위쪽 여백(카드 위 ~ 헤더 글자 = 78px)과 같은 간격으로 카드 맨 아래에 놓아요 → 글이 로고와 겹치지 않도록 간격을 맞춰요
  const LH=40, LY=H-78-LH, LIM=LY-34;   // 설명 마지막 줄 baseline 한계
  let py=hasN?906:930, G=30; const fixed=(hasN?219:177)+(dl.length-1)*46, n=hasN?3:2;
  if(py+fixed+n*G>LIM){ G=Math.floor((LIM-py-fixed)/n); if(G<22){ G=22; py=Math.max(890,LIM-fixed-n*G); } }   // 네 영역(알약·닉네임·유형 이름·설명)의 간격은 모두 G로 같아요
  // 오각형(글자 포함)을 위·아래 여백이 같도록 배치: 헤더 글자 아래(111) ~ 오각형 위 = 오각형 아래 ~ 알약 위
  // 오각형 위쪽 끝 = cy-345, 아래쪽 끝 = cy+330
  py-=16;   // 알약·닉네임·유형 이름·설명 덩어리를 위로 올려 하단 로고와 간격을 벌려요
  const cy=Math.round((py+126)/2);   // 오각형은 헤더 글자 아래 여백 = 알약 위 여백이 되도록 가운데에 놓아요
  const cx=540, R=235, N=AX.length;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/N; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  for(let k=1;k<=5;k++){ c.beginPath(); for(let i=0;i<N;i++){ const [x,y]=pt(i,R*k/5); i?c.lineTo(x,y):c.moveTo(x,y); } c.closePath(); c.strokeStyle=k===5?TH.g1:TH.g2; c.lineWidth=2; c.stroke(); }
  c.strokeStyle=TH.g2; for(let i=0;i<N;i++){ const [x,y]=pt(i,R); c.beginPath(); c.moveTo(cx,cy); c.lineTo(x,y); c.stroke(); }
  c.beginPath(); sc.forEach((v,i)=>{ const [x,y]=pt(i,R*Math.max(v||0,4)/100); i?c.lineTo(x,y):c.moveTo(x,y); }); c.closePath();
  c.fillStyle=hx(0.25); c.fill(); c.strokeStyle=ACC; c.lineWidth=5; c.lineJoin='round'; c.stroke();
  sc.forEach((v,i)=>{ if(v==null) return; const [x,y]=pt(i,R*Math.max(v,4)/100); c.beginPath(); c.arc(x,y,9,0,Math.PI*2); c.fillStyle=ACC; c.fill(); });
  c.textAlign='center';
  AX.forEach((a,i)=>{ const [x,y]=pt(i,R+78); c.fillStyle=TH.fg; c.font=`700 32px ${FONT}`; c.fillText(a.ko,x,y-4); c.fillStyle=sc[i]==null?TH.none:ACC; c.font=`800 40px ${FONT}`; c.fillText(sc[i]==null?'-':String(sc[i]),x,y+40);
    const pc=state.pct[a.id]; if(pc){ c.fillStyle=TH.pct; c.font=`600 26px ${FONT}`; c.fillText('상위 '+pc.p+'%',x,y+74); } });
  // tier pill
  c.textAlign='left'; c.font=`700 36px ${FONT}`;
  const op=overallTop(AX.map(a=>state.pct[a.id]?state.pct[a.id].p:null)), pill=`종합 점수 ${cls.avg}`+(op!=null?` · 상위 ${op}%`:''), pw=c.measureText(pill).width+60;
  c.font=`700 36px ${FONT}`;
  let yy=py+68;   // 닉네임이 있으면 알약을 조금 올리고, 유형 이름 위에 닉네임을 넣어요
  c.beginPath(); if(c.roundRect) c.roundRect(72,py,pw,68,34); else c.rect(72,py,pw,68);
  c.strokeStyle=ACC; c.lineWidth=2; c.stroke(); c.fillStyle=ACC; c.fillText(pill,102,py+46);
  if(hasN){ yy+=G+Math.round(44*.86); c.fillStyle=TH.fg; c.font=`700 44px ${FONT}`; c.fillText(state.name,72+inkL(state.name),yy); yy+=Math.round(44*.1); }
  // type
  // 유형 이름이 길면 카드 폭(936px)에 맞게 글자 크기를 줄여요
  c.font=`800 84px ${FONT}`; const tfs=Math.min(84,Math.floor(84*(W-144)/Math.max(1,c.measureText(T.ko).width)));
  c.fillStyle=TH.fg; c.font=`800 ${tfs}px ${FONT}`; yy+=G+Math.round(tfs*.86); c.fillText(T.ko,72+inkL(T.ko)-2,yy); yy+=Math.round(tfs*.1);
  const dy=yy+G+Math.round(34*.86);
  c.fillStyle=TH.desc; c.font=`500 34px ${FONT}`;
  dl.forEach((l,i)=>c.fillText(l,72+inkL(l),dy+i*46));
  // 하단 중앙 로고(첫 화면 헤더의 로고 이미지)
  { const lg=document.querySelector('.brand .logo');
    if(lg && lg.complete && lg.naturalWidth){ const lh=LH, lw=Math.round(lh*lg.naturalWidth/lg.naturalHeight); let src=lg;
      if(LT){ const o=document.createElement('canvas'); o.width=lg.naturalWidth; o.height=lg.naturalHeight; const oc=o.getContext('2d'); oc.drawImage(lg,0,0); oc.globalCompositeOperation='source-in'; oc.fillStyle='#111'; oc.fillRect(0,0,o.width,o.height); src=o; }   // 밝은 카드에서는 흰 로고를 검정으로
      c.drawImage(src,Math.round((W-lw)/2),LY,lw,lh); } }
}

$('#demoBtn').onclick=()=>{ state.demo=!state.demo; renderHome(); toast(state.demo?'체험 모드를 켰어요':'체험 모드를 껐어요',true); };
document.addEventListener('click',e=>{ const b=e.target.closest('#sexSeg button'); if(!b) return; state.sex=b.dataset.s; persist(); syncSex(); });
function sexPickHtml(){
  const on=v=>state.sex===v?' class="on"':'';
  return `<div class="sexbox"><div class="sexpick"><span class="sl">성별 <em>(선택)</em></span><div class="seg" id="sexSeg"><button data-s="m"${on('m')}>남</button><button data-s="f"${on('f')}>여</button><button data-s=""${on('')}>선택 안 함</button></div></div><p class="fine sexnote">선택하지 않으면 남·녀 통합으로 상위 %가 계산돼요.</p></div>`;
}
function syncSex(){ document.querySelectorAll('#sexSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===state.sex)); }
function askConfirm(msg,yesText){
  return new Promise(resolve=>{
    const box=$('#dlg'); $('#dlgMsg').textContent=msg; $('#dlgYes').textContent=yesText||'확인'; box.hidden=false;
    const done=v=>{ box.hidden=true; $('#dlgYes').onclick=$('#dlgNo').onclick=box.onclick=null; resolve(v); };
    $('#dlgYes').onclick=()=>done(true); $('#dlgNo').onclick=()=>done(false);
    box.onclick=e=>{ if(e.target===box) done(false); };
    $('#dlgNo').focus();
  });
}
$('#resetHome').onclick=async()=>{ if(!await askConfirm('측정한 기록이 모두 지워져요.\n초기화할까요?','초기화')) return; state.scores={}; state.labels={}; state.pct={}; state.results={}; persist(); renderHome(); toast('기록을 초기화했어요'); };
$('#evBack').onclick=()=>{ cancelRun(); renderHome(); show('home'); };
$('#finBack').onclick=()=>{ renderHome(); show('home'); };
$('#resetBtn').onclick=async()=>{ if(!await askConfirm('측정 기록은 그대로 유지돼요.\n첫 화면으로 이동할까요?','이동')) return; renderHome(); show('home'); };   // 기록은 그대로 두고 홈으로
let nickRaf=0;
$('#nick').addEventListener('input',e=>{ state.name=e.target.value.trim(); persist(); cancelAnimationFrame(nickRaf); nickRaf=requestAnimationFrame(drawCard); });
$('#shareBtn').onclick=async()=>{
  drawCard();
  const blob=await cardBlob(); if(!blob) return;
  const file=new File([blob],'kye3-motionlab.png',{type:'image/png'});
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      // 폰: 공유(저장) 창을 끝까지 마쳤을 때만 완료 문구 (취소하면 안 떠요)
      await navigator.share({files:[file],title:'KYE3 MOTION LAB',text:'#KYE3 #MOTIONLAB @kye3_official'});
    } else {
      // PC 등 공유 기능이 없으면 브라우저 기본 다운로드 폴더에 PNG 파일로 저장
      const url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download='kye3-motionlab.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
    }
    toast('이미지가 저장되었습니다',true);
    track('motionlab_card_share',{type:classify(state.scores).typeKey});
  }catch(e){}
};
$('#ctaBtn').addEventListener('click',()=>track('motionlab_cta_click',{where:'final'}));

// 예전 버전에서 저장된 종목 기록 정리
{ const valid=new Set(AXES.map(a=>a.id)); ['scores','labels','pct'].forEach(k=>{ for(const id of Object.keys(state[k])) if(!valid.has(id)) delete state[k][id]; }); persist(); }
renderHome(); show('home');
// 테스트 훅 (로컬 점검용)
window.__lab={ state, openFinal, renderHome, drawCard };
})();

(function(){ const a=document.getElementById('logoLink'); if(!a) return;
  a.addEventListener('click',function(e){
    const w=Math.min(1100,screen.availWidth||1100), h=Math.min(800,screen.availHeight||800);
    const p=window.open(a.href,'kye3_home','popup=yes,noopener,width='+w+',height='+h+',left='+Math.max(0,((screen.availWidth||w)-w)/2)+',top='+Math.max(0,((screen.availHeight||h)-h)/2));
    if(p) e.preventDefault();   // 팝업이 막히면 기본 동작(새 탭)으로 열려요
  });
})();
